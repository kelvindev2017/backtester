name: Validate fundamental P/E

on:
  push:
    branches: [validation-run]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate_fundamental_pe.py 2>&1 | tee validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            validation.log
            validation_*.csv
