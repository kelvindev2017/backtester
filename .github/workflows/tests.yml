name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the tests (Yahoo, SEC and FRED are replaced by synthetic data)
        run: |
          set -o pipefail
          pytest -q -rs | tee pytest.log
      - name: Report the result
        if: always()
        run: echo "::notice title=pytest::$(tail -n 1 pytest.log)"
