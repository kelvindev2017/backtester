<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <!-- candlesticks -->
  <g stroke-width="2.4" stroke-linecap="round">
    <line x1="16" y1="30" x2="16" y2="50" stroke="#ef5350"/>
    <line x1="28" y1="26" x2="28" y2="46" stroke="#26a69a"/>
    <line x1="40" y1="16" x2="40" y2="40" stroke="#26a69a"/>
  </g>
  <rect x="12" y="34" width="8" height="12" rx="1.5" fill="#ef5350"/>
  <rect x="24" y="30" width="8" height="12" rx="1.5" fill="#26a69a"/>
  <rect x="36" y="20" width="8" height="16" rx="1.5" fill="#26a69a"/>
  <!-- equity curve -->
  <polyline points="8,52 22,44 32,47 52,20" fill="none" stroke="#ffc94d"
            stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="56,14 55,26 45,20" fill="#ffc94d"/>
</svg>
